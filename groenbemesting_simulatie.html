<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groenbemesting simulatie</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f3ee; color: #1a1a18; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
  .container { width: 100%; max-width: 680px; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; color: #1a1a18; }
  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .jaar-badge { font-size: 13px; color: #5f5e5a; background: #e8e6df; border: 0.5px solid #d3d1c7; border-radius: 8px; padding: 6px 14px; }
  .jaar-badge span { font-size: 18px; font-weight: 500; color: #1a1a18; margin-left: 4px; }
  .fase-label { font-size: 13px; color: #5f5e5a; }
  .step-dots { display: flex; gap: 6px; margin-left: auto; align-items: center; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #d3d1c7; transition: background 0.3s; }
  .step-dot.active { background: #3a7d44; }
  .step-dot.done { background: #97c459; }
  .field-area { position: relative; width: 100%; height: 140px; border-radius: 12px; border: 0.5px solid #d3d1c7; overflow: hidden; margin-bottom: 1.25rem; }
  .sky { position: absolute; top: 0; left: 0; right: 0; height: 55px; background: #87CEEB; transition: background 0.6s; }
  .sky.herfst { background: #b8a05a; }
  .sky.winter { background: #c8d8e8; }
  .soil { position: absolute; bottom: 0; left: 0; right: 0; height: 85px; background: #8B6914; transition: background 0.6s; }
  .soil.rijk { background: #5a3a0a; }
  .soil.arm { background: #c8a050; }
  .crop-layer { position: absolute; bottom: 55px; left: 0; right: 0; display: flex; align-items: flex-end; justify-content: space-around; padding: 0 12px; height: 60px; }
  .plant { display: flex; flex-direction: column; align-items: center; }
  .stalk { width: 3px; border-radius: 2px; }
  .stalk.geel { background: #c8a020; }
  .stalk.paars { background: #7c3aed; }
  .stalk.gras-kleur { background: #22a040; }
  .stalk.bruin { background: #a0824a; }
  .stalk.klein { height: 10px; }
  .stalk.middel { height: 26px; }
  .stalk.groot { height: 44px; }
  .kop { width: 10px; height: 10px; border-radius: 50%; }
  .kop.graan { background: #f5c842; }
  .kop.vlinder { background: #8B5CF6; }
  .kop.gras { background: #22c55e; }
  .kop.leeg { background: transparent; }
  .season-label { position: absolute; top: 8px; left: 14px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.9); }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .metric { background: #e8e6df; border-radius: 8px; padding: 12px 14px; }
  .metric-label { font-size: 12px; color: #5f5e5a; margin-bottom: 4px; }
  .metric-val { font-size: 22px; font-weight: 500; color: #1a1a18; }
  .metric-bar { height: 5px; border-radius: 3px; background: #d3d1c7; margin-top: 6px; }
  .metric-fill { height: 100%; border-radius: 3px; transition: width 0.7s; }
  .fill-n { background: #3a7d44; }
  .fill-op { background: #e69b20; }
  .fill-h { background: #5b7fa6; }
  .metric-delta { font-size: 11px; margin-top: 3px; min-height: 14px; }
  .delta-pos { color: #3a7d44; }
  .delta-neg { color: #c0451a; }
  .delta-nul { color: #888780; }
  .chart-wrap { margin-bottom: 1.25rem; }
  .chart-title { font-size: 13px; color: #5f5e5a; margin-bottom: 6px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: #5f5e5a; margin-bottom: 6px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
  .history-bars { display: flex; align-items: flex-end; gap: 5px; height: 90px; }
  .h-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .h-bar { width: 100%; border-radius: 3px 3px 0 0; transition: height 0.5s, background 0.5s; min-height: 2px; }
  .h-val { font-size: 10px; color: #5f5e5a; }
  .h-lbl { font-size: 10px; color: #888780; }
  .feedback-box { padding: 12px 14px; border-radius: 8px; margin-bottom: 1rem; font-size: 13px; line-height: 1.6; border-left: 3px solid; }
  .feedback-box.goed { background: #eaf3de; border-color: #3a7d44; color: #27500a; }
  .feedback-box.slecht { background: #faeeda; border-color: #854f0b; color: #412402; }
  .feedback-box.info { background: #e6f1fb; border-color: #185fa5; color: #042c53; }
  .phase-panel { border: 0.5px solid #d3d1c7; border-radius: 12px; padding: 1rem 1.25rem; background: #fff; margin-bottom: 1.25rem; min-height: 60px; }
  .phase-title { font-size: 13px; font-weight: 500; color: #5f5e5a; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice-btn { font-size: 13px; padding: 8px 14px; border: 0.5px solid #b4b2a9; border-radius: 8px; background: #fff; color: #1a1a18; cursor: pointer; transition: all 0.15s; line-height: 1.3; text-align: left; }
  .choice-btn:hover { background: #f1efe8; }
  .choice-btn.selected { border-color: #5f5e5a; background: #e8e6df; color: #1a1a18; font-weight: 500; }
  .choice-sub { font-size: 11px; color: #5f5e5a; display: block; margin-top: 2px; font-weight: 400; }
  .choice-btn.selected .choice-sub { color: #444441; }
  .next-btn { width: 100%; padding: 11px; border: 0.5px solid #b4b2a9; border-radius: 8px; background: #fff; color: #1a1a18; font-size: 14px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .next-btn:hover:not(:disabled) { background: #f1efe8; }
  .next-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .next-btn.primary { background: #3a7d44; color: #fff; border-color: #3a7d44; }
  .next-btn.primary:hover:not(:disabled) { background: #2d6035; }
  .reset-btn { font-size: 12px; color: #5f5e5a; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; margin-top: 10px; display: block; margin-left: auto; margin-right: auto; }
  .totals-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .total-card { background: #e8e6df; border-radius: 8px; padding: 10px 12px; }
  .total-label { font-size: 11px; color: #5f5e5a; }
  .total-val { font-size: 20px; font-weight: 500; }
  .summary-table { width: 100%; font-size: 12px; border-collapse: collapse; }
  .summary-table th { text-align: left; font-weight: 500; padding: 6px 6px; border-bottom: 0.5px solid #d3d1c7; color: #5f5e5a; }
  .summary-table td { padding: 5px 6px; border-bottom: 0.5px solid #e8e6df; vertical-align: top; }
</style>
</head>
<body>
<div class="container">
  <h1>Groenbemesting &amp; bodemvruchtbaarheid</h1>

  <div class="top-bar">
    <div class="jaar-badge">Jaar <span id="jaar-num">1</span> <span style="font-size:13px;font-weight:400;color:#5f5e5a">van 6</span></div>
    <div class="fase-label" id="fase-label"></div>
    <div class="step-dots" id="step-dots"></div>
  </div>

  <div class="field-area">
    <div class="sky" id="sky"></div>
    <div class="soil" id="soil"></div>
    <div class="crop-layer" id="crops"></div>
    <div class="season-label" id="season-lbl"></div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Bodem-N (stikstof)</div>
      <div class="metric-val" id="n-val">100</div>
      <div class="metric-bar"><div class="metric-fill fill-n" id="n-bar" style="width:100%"></div></div>
      <div class="metric-delta" id="n-delta"></div>
    </div>
    <div class="metric">
      <div class="metric-label">Oogst dit jaar</div>
      <div class="metric-val" id="op-val">–</div>
      <div class="metric-bar"><div class="metric-fill fill-op" id="op-bar" style="width:0%"></div></div>
      <div class="metric-delta" id="op-delta"></div>
    </div>
    <div class="metric">
      <div class="metric-label">Bodemgezondheid</div>
      <div class="metric-val" id="h-val">100%</div>
      <div class="metric-bar"><div class="metric-fill fill-h" id="h-bar" style="width:100%"></div></div>
      <div class="metric-delta" id="h-delta"></div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-title">Oogstopbrengst per jaar (% t.o.v. beginwaarde)</div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:#639922"></span>Goed (≥80%)</span>
      <span class="legend-item"><span class="legend-dot" style="background:#e69b20"></span>Matig (50–79%)</span>
      <span class="legend-item"><span class="legend-dot" style="background:#d85a30"></span>Slecht (&lt;50%)</span>
      <span class="legend-item"><span class="legend-dot" style="background:#d3d1c7"></span>Geen oogst</span>
    </div>
    <div class="history-bars" id="hist-bars"></div>
  </div>

  <div id="feedback-area"></div>

  <div class="phase-panel" id="phase-panel">
    <div class="phase-title" id="panel-title"></div>
    <div class="choices" id="choices-area"></div>
  </div>

  <button class="next-btn" id="next-btn" disabled>
    <span id="next-label">Volgende</span> →
  </button>
  <button class="reset-btn" onclick="resetSim()">↺ Opnieuw beginnen</button>
</div>

<script>
const MAX_YEARS = 6;

const GEWAS_OPTIES = [
  {
    id: 'hoofdgewas',
    label: 'Hoofdgewas verbouwen',
    sub: 'Graan, aardappel, etc. — levert dit jaar opbrengst',
    stalkKleur: 'geel', kopKleur: 'graan', maat: 'groot', sky: 'zomer',
    nBaseEffect: -28, nVeroudering: 1.5, hEffect: -10,
    geeftOogst: true
  },
  {
    id: 'vlinder',
    label: 'Vlinderbloemigen inzaaien',
    sub: 'Klaver, luzerne — geen oogst dit jaar',
    stalkKleur: 'paars', kopKleur: 'vlinder', maat: 'middel', sky: 'zomer',
    nEffect: 0, hEffect: 0,
    geeftOogst: false,
    nBasisBonus: 35, hBasisBonus: 15
  },
  {
    id: 'grassen',
    label: 'Grassen / granen inzaaien',
    sub: 'Rogge, grassen — geen oogst dit jaar',
    stalkKleur: 'gras-kleur', kopKleur: 'gras', maat: 'middel', sky: 'zomer',
    nEffect: 0, hEffect: 0,
    geeftOogst: false,
    nBasisBonus: 5, hBasisBonus: 10
  },
  {
    id: 'niets',
    label: 'Niets doen',
    sub: 'Akker blijft leeg — geen oogst, geen inzaai',
    stalkKleur: 'bruin', kopKleur: 'leeg', maat: 'klein', sky: 'herfst',
    nEffect: -5, hEffect: -8,
    geeftOogst: false,
    nBasisBonus: 0, hBasisBonus: -5
  }
];

const EIND_OPTIES = [
  { id: 'onderploegen', label: 'Onderploegen', sub: 'Plantenresten de grond in werken', nMult: 1.0, hBonus: 10 },
  { id: 'oogsten',      label: 'Oogsten en afvoeren', sub: 'Biomassa van het land halen', nMult: 0.25, hBonus: 2 },
  { id: 'niets',        label: 'Niets doen', sub: 'Akker zo achterlaten', nMult: 0, hBonus: -5 }
];

let state = {};

function initState() {
  state = { jaar: 1, fase: 0, bodemN: 100, bodemHealth: 100, prevN: 100, prevH: 100, oogstHistory: [], gewasKeuze: null, eindKeuze: null, jaarLog: [] };
}

function getOpbrengst(n, h) {
  return Math.round((Math.min(n / 100, 1.1) * 0.7 + Math.min(h / 100, 1) * 0.3) * 100);
}

function renderField(skyClass, stalkKleur, kopKleur, maat) {
  document.getElementById('sky').className = 'sky' + (skyClass ? ' ' + skyClass : '');
  document.getElementById('season-lbl').textContent = skyClass === 'herfst' ? 'Herfst' : skyClass === 'winter' ? 'Winter' : 'Zomer';
  const nPct = state.bodemN / 100;
  document.getElementById('soil').className = 'soil' + (nPct > 0.7 ? ' rijk' : nPct < 0.3 ? ' arm' : '');
  let html = '';
  for (let i = 0; i < 14; i++) {
    html += `<div class="plant"><div class="stalk ${stalkKleur} ${maat}"></div><div class="kop ${kopKleur}"></div></div>`;
  }
  document.getElementById('crops').innerHTML = html;
}

function renderMetrics(showDeltas) {
  const n = Math.max(0, Math.round(state.bodemN));
  const h = Math.max(0, Math.round(state.bodemHealth));
  document.getElementById('n-val').textContent = n;
  document.getElementById('n-bar').style.width = Math.min(n, 100) + '%';
  document.getElementById('h-val').textContent = h + '%';
  document.getElementById('h-bar').style.width = Math.min(h, 100) + '%';
  if (showDeltas) {
    document.getElementById('n-delta').innerHTML = deltaHtml(Math.round(state.bodemN - state.prevN));
    document.getElementById('h-delta').innerHTML = deltaHtml(Math.round(state.bodemHealth - state.prevH));
  } else {
    document.getElementById('n-delta').innerHTML = '';
    document.getElementById('h-delta').innerHTML = '';
  }
}

function deltaHtml(d) {
  if (d > 0) return `<span class="delta-pos">▲ +${d}</span>`;
  if (d < 0) return `<span class="delta-neg">▼ ${d}</span>`;
  return `<span class="delta-nul">= onveranderd</span>`;
}

function renderOogst(val) {
  document.getElementById('op-val').textContent = val !== null ? val + '%' : '–';
  document.getElementById('op-bar').style.width = val !== null ? Math.min(val, 100) + '%' : '0%';
  document.getElementById('op-delta').innerHTML = '';
}

function renderHistory() {
  let html = '';
  for (let i = 0; i < MAX_YEARS; i++) {
    const entry = state.oogstHistory[i];
    if (entry === undefined) {
      html += `<div class="h-bar-wrap"><div class="h-bar" style="height:4px;background:#e0ddd8;"></div><div class="h-val"></div><div class="h-lbl" style="color:#d3d1c7">J${i+1}</div></div>`;
    } else if (entry === null) {
      html += `<div class="h-bar-wrap"><div class="h-bar" style="height:12px;background:#d3d1c7;"></div><div class="h-val" style="color:#888780">—</div><div class="h-lbl">J${i+1}</div></div>`;
    } else {
      const barH = Math.round(entry * 0.65);
      const bg = entry >= 80 ? '#639922' : entry >= 50 ? '#e69b20' : '#d85a30';
      html += `<div class="h-bar-wrap"><div class="h-bar" style="height:${barH}px;background:${bg};"></div><div class="h-val">${entry}%</div><div class="h-lbl">J${i+1}</div></div>`;
    }
  }
  document.getElementById('hist-bars').innerHTML = html;
}

function renderDots() {
  let html = '';
  for (let i = 0; i < 3; i++) {
    const cls = state.fase > i + 1 ? 'done' : state.fase === i + 1 ? 'active' : '';
    html += `<div class="step-dot ${cls}"></div>`;
  }
  document.getElementById('step-dots').innerHTML = html;
}

function setFeedback(msg, type) {
  document.getElementById('feedback-area').innerHTML = msg ? `<div class="feedback-box ${type}">${msg}</div>` : '';
}

function setPanel(title, choicesHtml, nextLabel, nextEnabled) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('choices-area').innerHTML = choicesHtml;
  document.getElementById('next-label').textContent = nextLabel;
  const btn = document.getElementById('next-btn');
  btn.disabled = !nextEnabled;
  btn.className = nextEnabled ? 'next-btn primary' : 'next-btn';
}

function applyChoice(el, group) {
  document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('next-btn').disabled = false;
  document.getElementById('next-btn').className = 'next-btn primary';
}

window.kiesGewas = (el, id) => { state.gewasKeuze = id; applyChoice(el, 'gewas'); };
window.kiesEind  = (el, id) => { state.eindKeuze  = id; applyChoice(el, 'eind');  };

function renderPhase() {
  document.getElementById('jaar-num').textContent = state.jaar;
  renderHistory();
  renderDots();

  if (state.fase === 0) {
    document.getElementById('fase-label').textContent = 'Introductie';
    renderField('', 'geel', 'graan', 'groot');
    renderMetrics(false);
    renderOogst(null);
    setFeedback('Je beheert een akker gedurende <strong>6 jaar</strong>. Elk jaar kies je wat je verbouwt en wat je aan het einde van het seizoen doet. Zonder maatregelen loopt de bodemvruchtbaarheid terug — maar jij bepaalt hoe je dat aanpakt.', 'info');
    setPanel('Start de simulatie', '', 'Begin met jaar 1', true);
    document.getElementById('next-btn').onclick = () => { state.fase = 1; renderPhase(); };
    return;
  }

  if (state.fase === 1) {
    document.getElementById('fase-label').textContent = `Jaar ${state.jaar} – kies je gewas`;
    renderField('', 'geel', 'graan', 'klein');
    renderMetrics(false);
    renderOogst(null);
    setFeedback(`Bodem-N is momenteel <strong>${Math.round(state.bodemN)}</strong>, bodemgezondheid <strong>${Math.round(state.bodemHealth)}%</strong>. Wat ga je dit jaar verbouwen?`, 'info');
    const html = GEWAS_OPTIES.map(o =>
      `<button class="choice-btn" data-group="gewas" data-id="${o.id}" onclick="kiesGewas(this,'${o.id}')">${o.label}<span class="choice-sub">${o.sub}</span></button>`
    ).join('');
    setPanel('Wat verbouw je dit jaar?', html, 'Bevestig keuze →', false);
    document.getElementById('next-btn').onclick = () => { state.fase = 2; renderPhase(); };
    return;
  }

  if (state.fase === 2) {
    const gewas = GEWAS_OPTIES.find(o => o.id === state.gewasKeuze);
    document.getElementById('fase-label').textContent = `Jaar ${state.jaar} – einde seizoen`;
    renderField(gewas.sky === 'zomer' ? 'herfst' : gewas.sky, gewas.stalkKleur, gewas.kopKleur, gewas.maat);
    renderMetrics(false);
    renderOogst(null);
    const intro = gewas.geeftOogst
      ? 'Het hoofdgewas is rijp. Wat doe je nu met het gewas en de stoppels?'
      : `Het seizoen loopt ten einde. Wat doe je nu met de akker?`;
    setFeedback(intro, 'info');
    const eindOpties = gewas.id === 'niets'
      ? EIND_OPTIES.filter(o => o.id !== 'oogsten')
      : EIND_OPTIES;
    const html = eindOpties.map(o =>
      `<button class="choice-btn" data-group="eind" data-id="${o.id}" onclick="kiesEind(this,'${o.id}')">${o.label}<span class="choice-sub">${o.sub}</span></button>`
    ).join('');
    setPanel('Wat doe je aan het einde van het seizoen?', html, 'Bevestig keuze →', false);
    document.getElementById('next-btn').onclick = () => { state.fase = 3; renderPhase(); };
    return;
  }

  if (state.fase === 3) {
    const gewas = GEWAS_OPTIES.find(o => o.id === state.gewasKeuze);
    const eind  = EIND_OPTIES.find(o => o.id === state.eindKeuze);
    const jaar  = state.jaar;

    state.prevN = state.bodemN;
    state.prevH = state.bodemHealth;

    let oogstVal = null;
    let dN = 0, dH = 0;

    if (gewas.id === 'hoofdgewas') {
      oogstVal = getOpbrengst(state.bodemN, state.bodemHealth);
      dN = Math.round(gewas.nBaseEffect - (jaar - 1) * gewas.nVeroudering);
      dH = gewas.hEffect;
      if (eind.id === 'onderploegen') { dN += 5; dH += 5; }
      else if (eind.id === 'niets')   { dH -= 5; }
      state.oogstHistory[jaar - 1] = oogstVal;
    } else {
      dN = Math.round((gewas.nBasisBonus || 0) * eind.nMult) + (gewas.nEffect || 0);
      dH = (gewas.hBasisBonus || 0) + eind.hBonus + (gewas.hEffect || 0);
      if (gewas.id === 'niets') {
        dN = gewas.nEffect;
        dH = gewas.hEffect + eind.hBonus;
      }
      state.oogstHistory[jaar - 1] = null;
    }

    state.bodemN      = Math.min(130, Math.max(3, state.bodemN + dN));
    state.bodemHealth = Math.min(100, Math.max(5, state.bodemHealth + dH));
    state.jaarLog.push({ jaar, gewas: gewas.label, eind: eind.label, oogst: oogstVal, dN, dH });

    document.getElementById('fase-label').textContent = `Jaar ${jaar} – resultaat`;
    renderField('herfst', gewas.stalkKleur, gewas.kopKleur, gewas.maat);
    renderMetrics(true);
    renderOogst(oogstVal);
    renderHistory();

    const msg  = buildFeedback(gewas, eind, oogstVal, dN, dH);
    const type = dN >= 20 ? 'goed' : dN >= 0 ? 'info' : 'slecht';
    setFeedback(msg, type);

    if (jaar < MAX_YEARS) {
      setPanel('', '', `Naar jaar ${jaar + 1} →`, true);
      document.getElementById('next-btn').onclick = () => {
        state.jaar++;
        state.fase = 1;
        state.gewasKeuze = null;
        state.eindKeuze  = null;
        renderPhase();
      };
    } else {
      renderSummary();
    }
    return;
  }
}

function fmt(d) { return (d > 0 ? '+' : '') + d; }

function buildFeedback(gewas, eind, oogst, dN, dH) {
  const g = gewas.id, e = eind.id;
  let lines = [];

  if (g === 'hoofdgewas') {
    if (oogst >= 80) lines.push(`Goede oogst: <strong>${oogst}%</strong> van de beginopbrengst.`);
    else if (oogst >= 50) lines.push(`Matige oogst: <strong>${oogst}%</strong>. De bodem raakt langzaam uitgeput.`);
    else lines.push(`Slechte oogst: <strong>${oogst}%</strong>. De bodem heeft te weinig stikstof voor een volwaardig gewas.`);
    if (e === 'onderploegen') lines.push('Stoppels ondergeploegd — beperkt het verlies aan organische stof.');
    else if (e === 'oogsten') lines.push('Gewasresten afgevoerd. De bodem krijgt geen organisch materiaal terug.');
    else lines.push('Niets gedaan met de stoppels. Bodem verslechtert verder.');
  }
  if (g === 'vlinder') {
    if (e === 'onderploegen') lines.push(`Vlinderbloemigen bonden stikstof uit de lucht via <em>Rhizobium</em>-bacteriën in de wortelknolletjes. Na onderploegen beschikbaar voor de bodem.`);
    else if (e === 'oogsten') lines.push(`Vlinderbloemigen bonden stikstof, maar door oogsten en afvoeren verdwijnt het grootste deel mee.`);
    else lines.push(`Niets gedaan. De stikstof zit nog in de plant en bereikt de bodem nauwelijks.`);
  }
  if (g === 'grassen') {
    if (e === 'onderploegen') lines.push(`Grassen verbeteren de bodemstructuur en voegen organisch materiaal toe. Na onderploegen beschikbaar voor de bodem. Grassen binden zelf geen stikstof.`);
    else if (e === 'oogsten') lines.push(`Grassen boden bodembescherming, maar door afvoeren verdwijnen de nutriënten.`);
    else lines.push(`Niets gedaan. De grassen liggen er nog. De bodem profiteert nauwelijks.`);
  }
  if (g === 'niets') {
    if (e === 'onderploegen') lines.push('Er was niets te onderploegen — de akker lag kaal. Losse grond omwerken heeft nauwelijks effect.');
    else lines.push('De akker heeft het hele seizoen leeggelegen. Stikstof is uitgespoeld, bodemstructuur achteruitgegaan.');
  }

  lines.push(`Effect op bodem: stikstof <strong>${fmt(dN)}</strong>, gezondheid <strong>${fmt(dH)}%</strong>.`);
  return lines.join(' ');
}

function renderSummary() {
  const oogsten = state.oogstHistory.filter(v => v !== null && v !== undefined);
  const gem = oogsten.length ? Math.round(oogsten.reduce((a,b) => a+b, 0) / oogsten.length) : '–';
  const best = oogsten.length ? Math.max(...oogsten) : '–';

  const logRows = state.jaarLog.map(l => {
    const o = l.oogst !== null ? l.oogst + '%' : '–';
    return `<tr><td>J${l.jaar}</td><td>${l.gewas}</td><td>${l.eind}</td><td>${o}</td><td>${fmt(l.dN)} N &nbsp; ${fmt(l.dH)}% gez.</td></tr>`;
  }).join('');

  document.getElementById('phase-panel').innerHTML = `
    <div class="phase-title" style="margin-bottom:12px;">Simulatie afgerond — jouw resultaten</div>
    <div class="totals-grid">
      <div class="total-card"><div class="total-label">Gemiddelde oogst</div><div class="total-val">${gem}${typeof gem === 'number' ? '%' : ''}</div></div>
      <div class="total-card"><div class="total-label">Beste oogst</div><div class="total-val">${best}${typeof best === 'number' ? '%' : ''}</div></div>
      <div class="total-card"><div class="total-label">Jaren geoogst</div><div class="total-val">${oogsten.length} / 6</div></div>
      <div class="total-card"><div class="total-label">Eind bodem-N</div><div class="total-val">${Math.round(state.bodemN)}</div></div>
    </div>
    <table class="summary-table">
      <tr><th>Jaar</th><th>Gewas</th><th>Actie</th><th>Oogst</th><th>Bodemeffect</th></tr>
      ${logRows}
    </table>`;

  setPanel('', '', '', false);
  document.getElementById('next-btn').style.display = 'none';
}

window.resetSim = function() {
  initState();
  document.getElementById('next-btn').style.display = '';
  document.getElementById('phase-panel').innerHTML = '<div class="phase-title" id="panel-title"></div><div class="choices" id="choices-area"></div>';
  renderPhase();
};

initState();
renderPhase();
</script>
</body>
</html>
