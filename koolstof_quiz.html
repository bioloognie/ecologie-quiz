<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — koolstofkringloop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;color:#1a1a18;background:#f5f5f2;padding:1rem}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:16px;font-weight:500;margin-bottom:10px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.topbar span{font-size:12px;color:#666}
.lbtn{padding:4px 14px;border-radius:6px;border:1px solid #ccc;background:transparent;font-size:12px;cursor:pointer;font-family:inherit;color:#1a1a18;transition:all .15s}
.lbtn.active{background:#2d6a2d;color:#fff;border-color:#2d6a2d}
.progbar{height:4px;background:#e0e0da;border-radius:2px;margin-bottom:14px;overflow:hidden}
.progfill{height:100%;background:#F5A623;border-radius:2px;transition:width .4s}
.qcard{background:#fff;border:1px solid #e0e0da;border-radius:12px;padding:1.25rem;margin-bottom:10px}
.qmeta{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.qtype-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;margin-left:6px;font-weight:500}
.badge-mc{background:#e8f5e9;color:#2d6a2d}
.badge-drag{background:#e3f2fd;color:#1565c0}
.badge-open{background:#fff5d6;color:#7a5000}
.qtext{font-size:14px;font-weight:500;margin-bottom:14px;line-height:1.5}
.mc-opts{display:flex;flex-direction:column;gap:7px}
.mc-opt{background:#f5f5f2;border:1px solid #e0e0da;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:13px;text-align:left;font-family:inherit;color:#1a1a18;width:100%;transition:background .1s}
.mc-opt:hover:not(:disabled){background:#fff;border-color:#bbb}
.mc-opt.correct{background:#f0fdf4;border-color:#86efac;color:#166534}
.mc-opt.wrong{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.fb{font-size:13px;margin-top:10px;padding:9px 12px;border-radius:8px;line-height:1.55}
.fb.ok{background:#f0fdf4;color:#166534;border:1px solid #86efac}
.fb.nok{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}
.drag-bank{display:flex;flex-wrap:wrap;gap:7px;padding:8px;border:1px dashed #ccc;border-radius:8px;background:#f5f5f2;margin-bottom:10px;min-height:38px}
.chip{background:#fff;border:1px solid #ccc;border-radius:20px;padding:6px 13px;font-size:13px;cursor:grab;user-select:none;color:#1a1a18}
.chip:active{cursor:grabbing}
.chip.placed{opacity:.35;pointer-events:none}
.drag-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.drag-col-lbl{font-size:11px;color:#888;margin-bottom:4px}
.drag-zone{border:1px dashed #ccc;border-radius:8px;padding:7px 10px;min-height:44px;background:#fff;display:flex;flex-wrap:wrap;gap:5px;align-items:flex-start;transition:background .1s}
.drag-zone.over{background:#eff6ff;border-color:#93c5fd}
.drag-zone.correct{background:#f0fdf4;border-color:#86efac}
.drag-zone.wrong{background:#fef2f2;border-color:#fca5a5}
.open-input{width:100%;border:1px solid #ccc;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff;color:#1a1a18;margin-bottom:8px;resize:vertical;min-height:60px}
.open-input:focus{outline:none;border-color:#93c5fd}
.model-ans{font-size:12px;margin-top:8px;padding:8px 12px;background:#eff6ff;border-radius:8px;color:#1d4ed8;border:1px solid #93c5fd;line-height:1.5;display:none}
.model-ans.show{display:block}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#ddd;cursor:pointer;transition:background .2s}
.dot.ok{background:#2d6a2d}
.dot.nok{background:#dc2626}
.dot.cur{background:#F5A623}
.dot.skip{background:#a855f7}
.skip-btn{padding:5px 12px;border-radius:6px;border:1px solid #ccc;background:transparent;font-size:12px;cursor:pointer;font-family:inherit;color:#666;transition:all .15s}
.skip-btn:hover{border-color:#a855f7;color:#a855f7}
.score-card{background:#fff;border:1px solid #e0e0da;border-radius:12px;padding:2rem;text-align:center}
.score-big{font-size:42px;font-weight:500;margin-bottom:6px}
.score-sub{font-size:14px;color:#666;margin-bottom:1rem}
.skipped-notice{font-size:12px;color:#a855f7;margin-bottom:1rem;padding:6px 12px;background:#faf5ff;border-radius:6px;border:1px solid #d8b4fe;display:inline-block}
.action-btn{background:#fff;border:1px solid #ccc;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:inherit;color:#1a1a18;margin:4px}
.action-btn:hover{background:#f5f5f2}
.legend{font-size:11px;color:#888;margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
<h1>Quiz — koolstofkringloop</h1>
<div class="topbar">
  <span>Niveau:</span>
  <button class="lbtn active" id="btn-havo" onclick="setLevel('havo')">Havo</button>
  <button class="lbtn" id="btn-vwo" onclick="setLevel('vwo')">VWO</button>
  <span style="margin-left:auto;font-size:11px;color:#888" id="qcount"></span>
</div>
<div class="progbar"><div class="progfill" id="prog" style="width:0%"></div></div>
<div id="quiz-area"></div>
<div class="legend">
  <span><span class="legend-dot" style="background:#2d6a2d"></span>Goed</span>
  <span><span class="legend-dot" style="background:#dc2626"></span>Fout</span>
  <span><span class="legend-dot" style="background:#F5A623"></span>Huidige vraag</span>
  <span><span class="legend-dot" style="background:#a855f7"></span>Overgeslagen</span>
  <span><span class="legend-dot" style="background:#ddd"></span>Nog te doen</span>
</div>
</div>
<script>
var level='havo',curQ=0,answers=[],dragState={};
var SKIP='skip';
var sets={
havo:[
  {type:'mc',q:'Wat is de rol van fotosynthese in de koolstofkringloop?',opts:['CO₂ vrijmaken uit organische stoffen','CO₂ uit de atmosfeer vastleggen in glucose','Organisch materiaal afbreken tot CO₂ en water','Methaan omzetten naar CO₂'],ans:1,fb:'Planten en fotoautotrofe bacteriën gebruiken lichtenergie om CO₂ om te zetten in glucose (C₆H₁₂O₆). Dit is de snelle koolstofkringloop.'},
  {type:'drag',q:'Sleep elk proces naar de juiste categorie: snelle of langzame koolstofkringloop.',items:[{label:'Fotosynthese',cat:0},{label:'Verbranding fossiele brandstoffen',cat:1},{label:'Celademhaling',cat:0},{label:'Verwering van kalkgesteenten',cat:1},{label:'Afbraak door reducenten',cat:0}],cats:['Snelle kringloop','Langzame kringloop'],fb:'De snelle kringloop omvat processen op korte termijn (jaren–decennia). De langzame kringloop verloopt over duizenden tot miljoenen jaren.'},
  {type:'mc',q:'Een veengebied staat lange tijd onder water. Wat is de rol van de bodem voor koolstof?',opts:['Bron: er komt veel CO₂ vrij','Sink: koolstof wordt langzaam opgeslagen','Reservoir dat geen koolstof opneemt of afgeeft','Producent van glucose via fotosynthese'],ans:1,fb:'In natte, zuurstofarmebodems verloopt afbraak langzaam. Koolstof stapelt op als veen — de bodem is een sink. Bij droogte versnelt de afbraak en wordt de bodem een bron.'},
  {type:'open',q:'Leg uit wat het verschil is tussen een reservoir, een bron en een sink in de koolstofkringloop. Geef van elk een voorbeeld.',model:'Een reservoir is een opslagplaats voor koolstof (bijv. de atmosfeer, oceanen, fossiele brandstoffen). Een bron geeft netto koolstof af aan de atmosfeer (bijv. een gedraineerd veengebied). Een sink neemt netto koolstof op uit de atmosfeer (bijv. een woud, een natte veenbodem, de oceaan).'},
  {type:'mc',q:'Waarom vormt verbranding van fossiele brandstoffen een groter probleem dan het verbranden van recent geveld hout?',opts:['Fossiele brandstoffen bevatten meer energie','Fossiele brandstoffen stoten meer roet uit','Fossiele brandstoffen brengen koolstof vrij dat miljoenen jaren was opgeslagen','Er is geen verschil — beide produceren CO₂'],ans:2,fb:'Bij verbranding van biomassa komt koolstof vrij die recentelijk uit de atmosfeer was opgenomen — in principe neutraal. Fossiele brandstoffen bevatten "oude" koolstof die miljoenen jaren opgesloten zat, waardoor de CO₂-concentratie netto stijgt.'},
  {type:'drag',q:'Koppel elk onderdeel aan de juiste categorie uit het Binas-schema.',items:[{label:'Glucose',cat:0},{label:'CO₂ atmosfeer',cat:1},{label:'Organische stoffen dier',cat:2},{label:'Gistingsproducten',cat:3},{label:'CaCO₃',cat:1}],cats:['Producenten (groen)','Anorganisch (oranje)','Consumenten (blauw)','Reducenten (bruin)'],fb:'Groen = producenten. Oranje = anorganische reservoirs (CO₂, CaCO₃). Blauw = consumenten. Bruin = reducenten en hun producten.'},
  {type:'open',q:'Beschrijf de route die een koolstofatoom aflegt vanaf CO₂ in de atmosfeer totdat het als CO₂ vrijkomt via een dier. Noem alle stappen.',model:'1. CO₂ opgenomen door plant via fotosynthese → glucose. 2. Via assimilatie omgebouwd tot andere organische stoffen. 3. Dier eet plant → vertering en assimilatie → koolstof in organische stoffen dier. 4. Dier ademt CO₂ uit via celademhaling. Koolstof is terug in de atmosfeer.'},
  {type:'mc',q:'Wat is oceaanverzuring en hoe ontstaat het?',opts:['De oceaan warmt op door het broeikaseffect','Extra CO₂ lost op in zeewater en vormt koolzuur, waardoor de pH daalt','Zware metalen maken het zeewater zuurder','Algen produceren zuren die de pH verlagen'],ans:1,fb:'CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻. Door meer CO₂ in de atmosfeer lost er meer op in de oceaan, waardoor de pH daalt. Dit bemoeilijkt de kalkvorming door schelpdieren en koralen.'}
],
vwo:[
  {type:'mc',q:'Welke reactie beschrijft de netto fotosynthese correct?',opts:['6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (met lichtenergie)','C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ATP','6CO₂ + 6O₂ → C₆H₁₂O₆ + 6H₂O','CO₂ + H₂O → CH₂O + O₂ (zonder energie)'],ans:0,fb:'Netto fotosynthese: 6CO₂ + 6H₂O + lichtenergie → C₆H₁₂O₆ + 6O₂. Lichtreacties leveren ATP en NADPH; Calvin-cyclus fixeert CO₂ via RuBisCO.'},
  {type:'open',q:'Leg uit hoe de δ¹³C-waarde van atmosferische CO₂ bewijs levert dat de CO₂-stijging door menselijke activiteit wordt veroorzaakt.',model:'Fossiele brandstoffen zijn relatief arm aan ¹³C (planten fixeren bij voorkeur het lichtere ¹²CO₂). Verbranding voegt ¹³C-arme CO₂ toe aan de atmosfeer. Metingen laten zien dat de δ¹³C-waarde daalt naarmate de CO₂-concentratie stijgt — dit is een vingerafdruk van fossiele verbranding.'},
  {type:'drag',q:'Orden de afbraakroutes van hoogste naar laagste energieopbrengst (eindacceptor van elektronen).',items:[{label:'Nitraatreductie (NO₃⁻)',cat:1},{label:'Sulfaatreductie (SO₄²⁻)',cat:2},{label:'Zuurstof (O₂)',cat:0},{label:'Methanogenese (CO₂)',cat:3}],cats:['Hoogste opbrengst','2e hoogste','3e','Laagste opbrengst'],fb:'Volgorde: O₂ > NO₃⁻ > SO₄²⁻ > CO₂ (methanogenese). Micro-organismen gebruiken bij voorkeur de eindacceptor met de hoogste energieopbrengst.'},
  {type:'mc',q:'Welke uitspraak over de oplosbaarheid van CO₂ in oceaanwater is correct?',opts:['CO₂ lost beter op naarmate het water warmer wordt','CO₂ lost minder goed op naarmate het water warmer wordt','Temperatuur heeft geen effect op de oplosbaarheid van CO₂','CO₂ lost alleen op bij pH > 8'],ans:1,fb:'De oplosbaarheid van gassen neemt af bij hogere temperatuur (wet van Henry). Warmere oceanen nemen daardoor minder CO₂ op — een positieve terugkoppeling op klimaatopwarming.'},
  {type:'open',q:'Een veenbodem wordt gedraineerd voor landbouw. Beschrijf welke biologische en chemische processen optreden en waarom de CO₂-uitstoot toeneemt.',model:'Bij drainage daalt het grondwaterpeil en komt de bodem in contact met zuurstof. Aerobe micro-organismen breken nu organische stof af via aerobe dissimilatie: organische C + O₂ → CO₂ + H₂O. Hiervoor remden anaerobe condities de afbraak (bodem = sink). Na drainage wordt de bodem een sterke CO₂-bron.'},
  {type:'mc',q:'Methanogene archaea produceren CH₄ via CO₂ + 4H₂ → CH₄ + 2H₂O. Wat is de functie van H₂?',opts:['H₂ is de koolstofbron voor CH₄','H₂ fungeert als elektronendonor (reductor)','H₂ verhoogt de pH van het milieu','H₂ is een bijproduct zonder functie'],ans:1,fb:'H₂ dient als elektronendonor: de elektronen worden gebruikt om CO₂ te reduceren tot CH₄. Dit is lithotrofe methanogenese waarbij anorganisch H₂ de energiebron is.'},
  {type:'drag',q:'Koppel elk koolstofreservoir aan de juiste verblijftijd.',items:[{label:'Atmosfeer (CO₂)',cat:1},{label:'Fossiele brandstoffen',cat:3},{label:'Levende biomassa (planten)',cat:0},{label:'Oceaan (diepzee)',cat:2}],cats:['Jaren–decennia','Jaren–eeuwen','Eeuwen–millennia','Miljoenen jaren'],fb:'Levende biomassa: jaren–decennia. Atmosfeer: jaren–eeuwen. Diepzeewater: eeuwen–millennia. Fossiele brandstoffen: miljoenen jaren.'},
  {type:'open',q:'De Urey-reactie: CaSiO₃ + CO₂ → CaCO₃ + SiO₂. Leg uit hoe dit op geologische tijdschaal als negatieve terugkoppeling op klimaatopwarming werkt.',model:'Bij hogere temperatuur neemt verwering van silicaatgesteenten toe. De Urey-reactie verbruikt dan meer CO₂ → concentratie daalt → temperatuur daalt. Dit is een negatieve terugkoppeling: de verstoring wordt tegengewerkt. Het proces werkt op tijdschaal van honderdduizenden tot miljoenen jaren.'}
]};

function setLevel(l){level=l;curQ=0;answers=[];document.getElementById('btn-havo').classList.toggle('active',l==='havo');document.getElementById('btn-vwo').classList.toggle('active',l==='vwo');renderQ();}
function qs(){return sets[level];}
function renderQ(){
  var q=qs()[curQ];
  document.getElementById('qcount').textContent='Vraag '+(curQ+1)+' van '+qs().length;
  var done=answers.filter(function(a){return a!==undefined&&a!==SKIP;}).length;
  document.getElementById('prog').style.width=Math.round(done/qs().length*100)+'%';
  var area=document.getElementById('quiz-area');area.innerHTML='';
  var card=document.createElement('div');card.className='qcard';
  var typeLabel={mc:'Meerkeuze',drag:'Sleepvraag',open:'Open vraag'};
  var badgeClass={mc:'badge-mc',drag:'badge-drag',open:'badge-open'};
  card.innerHTML='<div class="qmeta">'+level.toUpperCase()+' &nbsp;·&nbsp; Vraag '+(curQ+1)+' van '+qs().length+'<span class="qtype-badge '+badgeClass[q.type]+'">'+typeLabel[q.type]+'</span></div><div class="qtext">'+q.q+'</div>';
  if(q.type==='mc') card.appendChild(renderMC(q));
  else if(q.type==='drag') card.appendChild(renderDrag(q));
  else card.appendChild(renderOpen(q));
  area.appendChild(card);
  renderNav();
}
function renderNav(){
  var existing=document.getElementById('nav-row');if(existing) existing.remove();
  var nav=document.createElement('div');nav.className='nav-row';nav.id='nav-row';
  var dots=qs().map(function(_,i){var a=answers[i];var cls='dot';if(i===curQ) cls+=' cur';else if(a===true) cls+=' ok';else if(a===false) cls+=' nok';else if(a===SKIP) cls+=' skip';return '<div class="'+cls+'" title="Vraag '+(i+1)+'" onclick="jumpTo('+i+')"></div>';}).join('');
  var good=answers.filter(function(a){return a===true;}).length;
  var skipped=answers.filter(function(a){return a===SKIP;}).length;
  var rightSide='<div style="display:flex;align-items:center;gap:8px"><button class="skip-btn" onclick="skipQ()">Overslaan</button><span style="font-size:12px;color:#888">'+good+' goed'+(skipped?' · <span style="color:#a855f7">'+skipped+' overgeslagen</span>':'')+'</span></div>';
  nav.innerHTML='<div class="dots">'+dots+'</div>'+rightSide;
  document.querySelector('.wrap').appendChild(nav);
}
function jumpTo(i){curQ=i;renderQ();}
function skipQ(){answers[curQ]=SKIP;advance();}
function advance(){var next=findNext();if(next!==-1){curQ=next;renderQ();}else showScore();}
function findNext(){for(var i=curQ+1;i<qs().length;i++) if(answers[i]===undefined||answers[i]===SKIP) return i;for(var i=0;i<curQ;i++) if(answers[i]===undefined||answers[i]===SKIP) return i;return -1;}
function renderMC(q){var wrap=document.createElement('div');wrap.className='mc-opts';q.opts.forEach(function(o,i){var btn=document.createElement('button');btn.className='mc-opt';btn.textContent=o;btn.onclick=function(){answerMC(q,i,wrap,btn);};wrap.appendChild(btn);});return wrap;}
function answerMC(q,i,wrap,btn){var ok=i===q.ans;wrap.querySelectorAll('.mc-opt').forEach(function(b,j){b.disabled=true;if(j===q.ans) b.classList.add('correct');else if(b===btn&&!ok) b.classList.add('wrong');});document.getElementById('nav-row').querySelector('.skip-btn').disabled=true;var fb=document.createElement('div');fb.className='fb '+(ok?'ok':'nok');fb.textContent=(ok?'Goed! ':'Helaas. ')+q.fb;wrap.parentElement.appendChild(fb);answers[curQ]=ok;renderNav();setTimeout(function(){advance();},1900);}
function renderDrag(q){
  dragState={placed:{}};var wrap=document.createElement('div');
  var bank=document.createElement('div');bank.className='drag-bank';
  q.items.forEach(function(item,i){var chip=document.createElement('div');chip.className='chip';chip.textContent=item.label;chip.dataset.i=i;chip.draggable=true;chip.addEventListener('dragstart',function(e){e.dataTransfer.setData('text',i);});bank.appendChild(chip);});
  wrap.appendChild(bank);
  var cols=document.createElement('div');cols.className='drag-cols';
  q.cats.forEach(function(cat,ci){var col=document.createElement('div');col.innerHTML='<div class="drag-col-lbl">'+cat+'</div>';var zone=document.createElement('div');zone.className='drag-zone';zone.dataset.cat=ci;zone.addEventListener('dragover',function(e){e.preventDefault();zone.classList.add('over');});zone.addEventListener('dragleave',function(){zone.classList.remove('over');});zone.addEventListener('drop',function(e){e.preventDefault();zone.classList.remove('over');var i=parseInt(e.dataTransfer.getData('text'));var chip=document.querySelector('.chip[data-i="'+i+'"]');if(!chip||chip.classList.contains('placed')) return;chip.classList.add('placed');var clone=chip.cloneNode(true);clone.draggable=false;clone.classList.remove('placed');clone.style.cursor='default';zone.appendChild(clone);dragState.placed[i]=ci;if(Object.keys(dragState.placed).length===q.items.length) checkDrag(q,cols,wrap);});col.appendChild(zone);cols.appendChild(col);});
  wrap.appendChild(cols);return wrap;
}
function checkDrag(q,cols,wrap){var ok=true;q.items.forEach(function(item,i){if(dragState.placed[i]!==item.cat) ok=false;});cols.querySelectorAll('.drag-zone').forEach(function(z,ci){var allOk=true;z.querySelectorAll('.chip').forEach(function(c){if(q.items[parseInt(c.dataset.i)].cat!==ci) allOk=false;});z.classList.add(allOk?'correct':'wrong');});document.getElementById('nav-row').querySelector('.skip-btn').disabled=true;var fb=document.createElement('div');fb.className='fb '+(ok?'ok':'nok');fb.textContent=(ok?'Helemaal goed! ':'Niet helemaal. ')+q.fb;wrap.appendChild(fb);answers[curQ]=ok;renderNav();setTimeout(function(){advance();},2300);}
function renderOpen(q){
  var wrap=document.createElement('div');
  var ta=document.createElement('textarea');ta.className='open-input';ta.placeholder='Schrijf hier je antwoord...';
  var btnRow=document.createElement('div');btnRow.style.cssText='display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap';
  var checkBtn=document.createElement('button');checkBtn.className='action-btn';checkBtn.textContent='Toon modelantwoord';
  var model=document.createElement('div');model.className='model-ans';model.innerHTML='<strong style="display:block;margin-bottom:4px">Modelantwoord:</strong>'+q.model;
  var selfRow=document.createElement('div');selfRow.style.cssText='display:none;gap:8px;margin-top:8px;flex-wrap:wrap';
  var gBtn=document.createElement('button');gBtn.className='action-btn';gBtn.textContent='Ik had het goed';
  var nBtn=document.createElement('button');nBtn.className='action-btn';nBtn.textContent='Ik had het fout';
  gBtn.onclick=function(){answers[curQ]=true;renderNav();selfRow.style.display='none';setTimeout(advance,600);};
  nBtn.onclick=function(){answers[curQ]=false;renderNav();selfRow.style.display='none';setTimeout(advance,600);};
  selfRow.appendChild(gBtn);selfRow.appendChild(nBtn);
  checkBtn.onclick=function(){model.classList.add('show');selfRow.style.display='flex';checkBtn.disabled=true;document.getElementById('nav-row').querySelector('.skip-btn').disabled=true;};
  btnRow.appendChild(checkBtn);wrap.appendChild(ta);wrap.appendChild(btnRow);wrap.appendChild(model);wrap.appendChild(selfRow);return wrap;
}
function showScore(){
  document.getElementById('prog').style.width='100%';
  var good=answers.filter(function(a){return a===true;}).length;
  var bad=answers.filter(function(a){return a===false;}).length;
  var skipped=answers.filter(function(a){return a===SKIP;}).length;
  var total=qs().length;var scored=good+bad;
  var pct=scored>0?Math.round(good/scored*100):0;
  var msg=pct>=80?'Uitstekend!':pct>=60?'Goed bezig, nog even oefenen.':'Er is nog wat te herhalen.';
  var skipNote=skipped>0?'<div class="skipped-notice">'+skipped+' vraag'+(skipped>1?'en':'')+' overgeslagen — klik "Opnieuw" om ze alsnog te beantwoorden.</div>':'';
  var area=document.getElementById('quiz-area');
