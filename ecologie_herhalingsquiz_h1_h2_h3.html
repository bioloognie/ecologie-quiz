
<style>
*{box-sizing:border-box}
.quiz-wrap{padding:1rem 0;font-size:14px;color:var(--color-text-primary)}
.chapter-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.ch-btn{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:14px 10px;cursor:pointer;text-align:center;transition:background .15s}
.ch-btn:hover{background:var(--color-background-secondary)}
.ch-btn.active{border:2px solid var(--color-border-info);background:var(--color-background-info)}
.ch-btn .ch-num{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.ch-btn .ch-title{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.ch-btn.active .ch-num,.ch-btn.active .ch-title{color:var(--color-text-info)}
.q-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem}
.q-meta{font-size:11px;color:var(--color-text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.q-text{font-size:14px;font-weight:500;margin-bottom:1rem;line-height:1.5}
.mc-options{display:flex;flex-direction:column;gap:7px}
.mc-opt{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 14px;cursor:pointer;font-size:13px;text-align:left;transition:background .1s;color:var(--color-text-primary)}
.mc-opt:hover:not(:disabled){background:var(--color-background-primary);border-color:var(--color-border-secondary)}
.mc-opt.correct{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.mc-opt.wrong{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}
.mc-opt.reveal{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.feedback{font-size:13px;margin-top:10px;padding:8px 12px;border-radius:var(--border-radius-md);line-height:1.5}
.feedback.ok{background:var(--color-background-success);color:var(--color-text-success)}
.feedback.nok{background:var(--color-background-danger);color:var(--color-text-danger)}
.drag-zone{display:flex;flex-wrap:wrap;gap:8px;min-height:38px;padding:8px;border:0.5px dashed var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);margin-bottom:8px}
.drag-target{border:0.5px dashed var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px 12px;min-width:120px;min-height:36px;background:var(--color-background-primary);display:flex;align-items:center;gap:6px;font-size:13px;transition:background .1s}
.drag-target.over{background:var(--color-background-info);border-color:var(--color-border-info)}
.drag-target.correct{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.drag-target.wrong{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}
.chip{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:20px;padding:6px 12px;font-size:13px;cursor:grab;user-select:none;color:var(--color-text-primary)}
.chip:active{cursor:grabbing}
.chip.placed{opacity:.4;cursor:default}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.score-bar{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--color-text-secondary)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--color-border-tertiary)}
.dot.ok{background:#3B6D11}.dot.nok{background:#A32D2D}.dot.cur{background:var(--color-border-info)}
.target-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
</style>

<h2 class="sr-only">Herhalingsquiz ecologie — hoofdstukken 1, 2 en 3</h2>

<div class="quiz-wrap">
  <div class="chapter-btns" id="ch-btns">
    <button class="ch-btn" onclick="startChapter(0)">
      <div class="ch-num">Hoofdstuk 1</div>
      <div class="ch-title">Inleiding & ecosystemen</div>
    </button>
    <button class="ch-btn" onclick="startChapter(1)">
      <div class="ch-num">Hoofdstuk 2</div>
      <div class="ch-title">Soorten & populaties</div>
    </button>
    <button class="ch-btn" onclick="startChapter(2)">
      <div class="ch-num">Hoofdstuk 3</div>
      <div class="ch-title">Voedselwebben & energie</div>
    </button>
  </div>

  <div id="quiz-area"></div>
</div>

<script>
const chapters = [
  {
    title:"Hoofdstuk 1 — Inleiding & ecosystemen",
    questions:[
      {type:"mc",q:"Wat is een ecosysteem?",opts:["Een groep dieren van dezelfde soort","Het geheel van alle levende organismen en hun niet-levende omgeving","Alleen de planten in een gebied","De bodem en het water in een gebied"],ans:1,fb:"Een ecosysteem omvat zowel alle levende organismen (biotisch) als de niet-levende omgeving (abiotisch) en de wisselwerking daartussen."},
      {type:"drag",q:"Sleep elke factor naar de juiste categorie: biotisch of abiotisch.",items:[{label:"Waterstand",cat:1},{label:"Grauwe gans",cat:0},{label:"Temperatuur",cat:1},{label:"Riet",cat:0},{label:"Bodem",cat:1}],cats:["Biotisch","Abiotisch"],fb:"Biotische factoren zijn alle levende componenten (planten, dieren). Abiotische factoren zijn niet-levend: water, temperatuur, bodem, licht."},
      {type:"mc",q:"Waarom is een hoge biodiversiteit belangrijk voor een ecosysteem?",opts:["Hoe meer soorten, hoe moooier het gebied eruitziet","Het maakt het ecosysteem veerkrachtiger bij verstoringen","Meer soorten betekent altijd meer voedsel voor mensen","Biodiversiteit heeft geen invloed op de werking van ecosystemen"],ans:1,fb:"Een hogere biodiversiteit zorgt voor meer veerkracht: als één soort wegvalt, kunnen andere soorten de rol overnemen. Dit helpt het ecosysteem om te herstellen na bijv. een overstroming."},
      {type:"mc",q:"De Vreugderijkerwaard is een rivieruiterwaard. Welke twee functies combineert dit gebied?",opts:["Landbouw en toerisme","Waterveiligheid en natuurontwikkeling","Visserij en recreatie","Drinkwaterwinning en landbouw"],ans:1,fb:"De Vreugderijkerwaard speelt een rol bij waterveiligheid (berging bij hoogwater) én natuurontwikkeling. Natuurmonumenten beheert het gebied met beide doelen voor ogen."},
    ]
  },
  {
    title:"Hoofdstuk 2 — Soorten & populaties",
    questions:[
      {type:"mc",q:"Wat is het verschil tussen een habitat en een niche?",opts:["Habitat is de rol van een soort, niche is de leefplek","Habitat is de leefplek, niche is de specifieke rol in het ecosysteem","Habitat en niche betekenen hetzelfde","Niche is alleen van toepassing op planten"],ans:1,fb:"De habitat is waar een soort leeft (bijv. steile rivieroever voor de ijsvogel). De niche is de rol die de soort speelt in het ecosysteem (bijv. de ijsvogel reguleert de visstand)."},
      {type:"drag",q:"Koppel elk begrip aan de juiste omschrijving.",items:[{label:"Draagkracht",cat:0},{label:"Exponentiële groei",cat:1},{label:"Logistische groei",cat:2}],cats:["Max. aantal individuen dat ecosysteem ondersteunt","Steeds sneller groeiende populatie","Groei die afvlakt richting een maximum"],fb:"Bij exponentiële groei zijn er geen beperkingen. Bij logistische groei neemt de groeisnelheid af naarmate de populatie de draagkracht benadert."},
      {type:"mc",q:"De grauwe gans (Anser anser) en de kolgans (Anser albifrons) lijken sterk op elkaar. Waarom zijn het toch twee verschillende soorten?",opts:["Ze hebben een andere kleur","Ze planten zich in de natuur niet met elkaar voort","Ze leven in verschillende landen","Ze hebben een andere grootte"],ans:1,fb:"Het soortbegrip is gebaseerd op voortplanting: twee populaties zijn aparte soorten als ze zich onder natuurlijke omstandigheden niet met elkaar voortplanten en geen vruchtbare nakomelingen produceren."},
      {type:"mc",q:"Een onderzoeker wil de populatie grote ratelaar schatten in de Vreugderijkerwaard. Welke methode is het meest geschikt?",opts:["Alle exemplaren in het hele gebied tellen","Een klein vak tellen en vermenigvuldigen voor het totale gebied","Fotograferen vanuit de lucht","Vragen aan bezoekers hoeveel ze er zien"],ans:1,fb:"Door een steekproef (kwadratenmethode) te nemen en te vermenigvuldigen met het totale oppervlak, krijg je een betrouwbare schatting zonder het hele gebied te hoeven doorzoeken."},
    ]
  },
  {
    title:"Hoofdstuk 3 — Voedselwebben & energie",
    questions:[
      {type:"drag",q:"Orden deze organismen van laagste naar hoogste trofisch niveau.",items:[{label:"Zeearend",cat:2},{label:"Gras",cat:0},{label:"Grauwe gans",cat:1}],cats:["Niveau 1 — producent","Niveau 2 — consument 1e orde","Niveau 3 — consument 2e orde"],fb:"Gras is de producent (maakt energie via fotosynthese). De grauwe gans eet het gras (consument 1e orde). De zeearend eet de gans (consument 2e orde)."},
      {type:"mc",q:"Wat is accumulatie in de context van persistente stoffen?",opts:["Het verdwijnen van schadelijke stoffen uit het ecosysteem","De ophoping van slecht afbreekbare stoffen in hogere schakels van de voedselketen","De verspreiding van stoffen via water","Het afbreken van organisch materiaal door reducenten"],ans:1,fb:"Persistente stoffen breken nauwelijks af. Via de voedselketen worden ze steeds verder geconcentreerd: een aalscholver bovenaan de keten heeft veel hogere concentraties dan de algen onderaan."},
      {type:"mc",q:"Waarom is er in hogere trofische niveaus altijd minder energie beschikbaar?",opts:["Omdat hogere niveaus minder eten","Omdat energie verloren gaat als warmte en bij levensprocessen","Omdat producenten de meeste energie opslaan in hun wortels","Omdat de zon minder energie geeft in de winter"],ans:1,fb:"Bij elke overdracht van energie tussen trofische niveaus gaat een groot deel verloren als warmte (bij ademhaling, beweging, groei). Typisch wordt slechts 10% doorgegeven naar het volgende niveau."},
      {type:"mc",q:"Wat laat een energiepiramide zien?",opts:["Hoeveel soorten er per niveau zijn","Hoeveel energie er per trofisch niveau beschikbaar is","Hoe voedselketens met elkaar verbonden zijn","De hoeveelheid biomassa per soort"],ans:1,fb:"Een energiepiramide toont de beschikbare energie per trofisch niveau. De basis (producenten) is het breedst, hogere niveaus worden smaller omdat er steeds minder energie beschikbaar is."},
    ]
  }
];

let curCh=-1,curQ=0,answers=[],dragState={};

function startChapter(i){
  curCh=i;curQ=0;answers=[];
  document.querySelectorAll('.ch-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  renderQ();
}

function renderQ(){
  const ch=chapters[curCh],q=ch.questions[curQ];
  const area=document.getElementById('quiz-area');
  area.innerHTML='';
  const card=document.createElement('div');
  card.className='q-card';
  card.innerHTML=`<div class="q-meta">${ch.title} &nbsp;·&nbsp; Vraag ${curQ+1} van ${ch.questions.length}</div><div class="q-text">${q.q}</div>`;
  if(q.type==='mc') card.appendChild(renderMC(q));
  else card.appendChild(renderDrag(q));
  area.appendChild(card);
  const nav=document.createElement('div');
  nav.className='nav-row';
  nav.innerHTML=`<div class="score-bar">${chapters[curCh].questions.map((_,i)=>`<div class="dot ${i<answers.length?(answers[i]?'ok':'nok'):(i===curQ?'cur':'')}"></div>`).join('')}</div><div style="font-size:13px;color:var(--color-text-secondary)">${answers.filter(Boolean).length} goed van ${answers.length}</div>`;
  area.appendChild(nav);
}

function renderMC(q){
  const wrap=document.createElement('div');
  wrap.className='mc-options';
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='mc-opt';btn.textContent=o;
    btn.onclick=()=>answerMC(q,i,wrap,btn);
    wrap.appendChild(btn);
  });
  return wrap;
}

function answerMC(q,i,wrap,btn){
  const correct=i===q.ans;
  wrap.querySelectorAll('.mc-opt').forEach((b,j)=>{
    b.disabled=true;
    if(j===q.ans) b.classList.add('correct');
    else if(b===btn&&!correct) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='feedback '+(correct?'ok':'nok');
  fb.textContent=(correct?'Goed! ':'Helaas. ')+q.fb;
  wrap.parentElement.appendChild(fb);
  answers.push(correct);
  setTimeout(()=>{ if(curQ<chapters[curCh].questions.length-1){curQ++;renderQ();}else showScore(); },1800);
}

function renderDrag(q){
  const wrap=document.createElement('div');
  dragState={placed:{},correct:null};
  const bank=document.createElement('div');
  bank.className='drag-zone';bank.id='bank';
  q.items.forEach((item,i)=>{
    const chip=document.createElement('div');
    chip.className='chip';chip.textContent=item.label;chip.dataset.i=i;
    chip.draggable=true;
    chip.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',i);});
    bank.appendChild(chip);
  });
  wrap.appendChild(bank);
  const targets=document.createElement('div');
  targets.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:8px';
  q.cats.forEach((cat,ci)=>{
    const col=document.createElement('div');
    col.innerHTML=`<div class="target-label">${cat}</div>`;
    const zone=document.createElement('div');
    zone.className='drag-target';zone.dataset.cat=ci;
    zone.style.cssText='flex-wrap:wrap;min-height:48px;align-items:flex-start;gap:6px';
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
    zone.addEventListener('drop',e=>{
      e.preventDefault();zone.classList.remove('over');
      const i=parseInt(e.dataTransfer.getData('text'));
      const chip=document.querySelector(`.chip[data-i="${i}"]`);
      if(!chip||chip.classList.contains('placed')) return;
      chip.classList.add('placed');
      const clone=chip.cloneNode(true);clone.draggable=false;clone.classList.remove('placed');
      clone.style.cursor='default';
      zone.appendChild(clone);
      dragState.placed[i]=ci;
      if(Object.keys(dragState.placed).length===q.items.length) checkDrag(q,targets,wrap);
    });
    col.appendChild(zone);targets.appendChild(col);
  });
  wrap.appendChild(targets);
  return wrap;
}

function checkDrag(q,targets,wrap){
  let ok=true;
  q.items.forEach((item,i)=>{
    if(dragState.placed[i]!==item.cat) ok=false;
  });
  targets.querySelectorAll('.drag-target').forEach((z,ci)=>{
    const allOk=[...z.querySelectorAll('.chip')].every(c=>{
      const i=parseInt(c.dataset.i);
      return q.items[i].cat===ci;
    });
    z.classList.add(allOk?'correct':'wrong');
  });
  const fb=document.createElement('div');
  fb.className='feedback '+(ok?'ok':'nok');
  fb.textContent=(ok?'Helemaal goed! ':'Niet helemaal. ')+q.fb;
  wrap.appendChild(fb);
  answers.push(ok);
  setTimeout(()=>{ if(curQ<chapters[curCh].questions.length-1){curQ++;renderQ();}else showScore(); },2200);
}

function showScore(){
  const good=answers.filter(Boolean).length,total=answers.length;
  const pct=Math.round(good/total*100);
  const area=document.getElementById('quiz-area');
  area.innerHTML=`
    <div class="q-card" style="text-align:center;padding:2rem 1.25rem">
      <div style="font-size:36px;font-weight:500;margin-bottom:6px">${good}/${total}</div>
      <div style="font-size:14px;color:var(--color-text-secondary);margin-bottom:1.5rem">${pct}% goed — ${pct>=80?'uitstekend!':pct>=60?'goed bezig, nog even oefenen.':'er is nog wat te herhalen.'}</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button onclick="startChapter(${curCh})">Opnieuw proberen</button>
        <button onclick="document.querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('active'));document.getElementById('quiz-area').innerHTML=''">Ander hoofdstuk</button>
      </div>
    </div>`;
}
</script>
